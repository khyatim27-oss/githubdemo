<!DOCTYPE html>
<html>
<head>
    <title>Live Weather - Pyodide</title>

    <!-- Load Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #85b6e0);
            text-align: center;
            padding: 50px;
            color: white;
        }

        .box {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        .btn:hover {
            background-color: #e68900;
            transform: scale(1.05);
        }
        button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: rgb(46, 103, 226);
            color: white;
            cursor: pointer;
        }
    </style>
    </head>
<body style="text-align:center; font-family:Arial;">

<h1>🌍 Weather Disaster Alert</h1>

<input type="text" id="city" placeholder="Enter city" />
<br><br>

<button onclick="getWeather()" class="btn">Check Weather</button>

<p id="output"></p>

<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

<script>
let pyodide;

async function loadPyodideAndPackages() {
    pyodide = await loadPyodide();
}
loadPyodideAndPackages();

async function getWeather() {
    let city = document.getElementById("city").value;

    // Fetch weather from API (JavaScript side)
    let response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=6cdab2bdd9feeb2e20784aff98e831de&units=metric`);
    let data = await response.json();

    let temp = data.main.temp;
    let condition = data.weather[0].main;
    let wind = data.wind.speed;

    // Send data to Python (Pyodide)
    let result = await pyodide.runPythonAsync(`
temp = ${temp}
condition = "${condition}"
wind = ${wind}

alert = "Normal"

if temp > 40:
    alert = "🔥 Heatwave Warning!"
elif "Rain" in condition:
    alert = "🌧️ Flood Risk!"
elif wind > 15:
    alert = "🌪️ Storm Warning!"

alert
`);

    document.getElementById("output").innerHTML = `
        <h3>Temperature: ${temp} °C</h3>
        <h3>Condition: ${condition}</h3>
        <h3>Wind: ${wind}</h3>
        <h2 style="color:red;">${result}</h2>
    `;
}
</script>

</body>
</html>
